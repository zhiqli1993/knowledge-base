[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kb"
version = "0.1.0"
description = "Knowledge Base Service, CLI, and MCP integration"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "pydantic>=2.0",
    "chromadb>=0.5.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "PyGithub>=2.3.0",
    "ollama>=0.1.0",
    "trafilatura>=1.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
kb = "kb.cli.main:cli_entry"
kb-http = "kb.http.__main__:main"
kb-mcp = "kb.mcp.server:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
