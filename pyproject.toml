[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kb"
version = "0.1.0"
description = "Knowledge base service, CLI, and MCP integration"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.2.0",
    "pydantic>=2.0",
    "chromadb>=0.5.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "PyGithub>=2.3.0",
    "ollama>=0.1.0",
]

[project.scripts]
kb = "kb.cli.main:cli_entry"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
