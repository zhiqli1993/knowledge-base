name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag} does not match pyproject.toml version {version}"
              )
          print(f"Verified release tag {actual_tag} matches package version {version}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ".[test]"

      - name: Run tests
        run: pytest -q

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*

  validate-wheel:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Install test runner and built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio
          python -m pip install dist/*.whl

      - name: Inspect installed package
        run: python -m pip show kb

      - name: Smoke test installed wheel
        run: python scripts/smoke_test_installed_commands.py

      - name: Run tests against installed wheel
        env:
          KB_TEST_INSTALLED_PACKAGE: "1"
        run: pytest -q

  build-binaries:
    needs: validate-wheel
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: windows-latest
            platform: windows
            arch: x64
          - runner: macos-13
            platform: darwin
            arch: x64
          - runner: macos-14
            platform: darwin
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install binary build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .

      - name: Build binary archive
        run: python scripts/build_binary_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Smoke test binary bundle
        run: python scripts/smoke_test_binary_bundle.py build/binary-release/bundles/kb-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Upload binary archive
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/kb-${{ matrix.platform }}-${{ matrix.arch }}*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - validate-wheel
      - build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            release-assets/*
          generate_release_notes: true
